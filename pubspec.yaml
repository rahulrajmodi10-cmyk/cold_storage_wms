name: cold_storage_wms
description: Cold Storage Warehouse Management System with Accounts, Finance, Logistics, AI Camera, Gatepass & Barcode
version: 1.0.0
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  archive: ^4.0.9

  # State Management
  provider: ^6.1.2
  # riverpod: ^2.5.1  # Alternative state management

  # Camera & AI
  camera: ^0.11.0
  image: ^4.2.0
  tflite_flutter: ^0.12.1
  # tflite_flutter_helper: ^0.3.1  # Optional helper

  # Barcode & QR Code
  barcode_scan2: ^4.3.0
  mobile_scanner: ^2.0.0
  qr_flutter: ^4.1.0
  zxing_lib: ^1.1.4  # For barcode generation

  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.12.0

  # Networking & Storage
  http: ^1.2.2
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Date/Time & Formatting
  intl: ^0.18.0
  timezone: ^0.8.0

  # Charts & Visualization
  fl_chart: ^0.63.0
  syncfusion_flutter_charts: ^24.2.6

  # Permissions & Device Info
  permission_handler: ^13.0.2

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.3
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  get_it: ^7.0.0
  injectable: ^2.0.0
  flutter_riverpod: ^2.5.1

  # File Handling
  file_picker: ^5.0.0
  open_filex: ^5.0.0
  share_plus: ^8.0.0

  # Background Tasks
  workmanager: ^0.5.0
  flutter_local_notifications: ^10.0.0

  # UI Components
  flutter_slidable: ^3.0.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^5.1.1
  dropdown_search: ^6.0.0
  # flutter_typeahead: ^7.0.0  # Commented: requires Dart >=3.12.0, incompatible with Dart 3.7.2

  # Maps & Location
  google_maps_flutter: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/labels/