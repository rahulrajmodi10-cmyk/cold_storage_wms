name: cold_storage_wms
description: "A comprehensive Cold Storage Warehouse Management System built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  sqflite_common_ffi: ^2.3.3+1

  # Network & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JSON & Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  # Date & Time
  intl: ^0.20.3
  timezone: ^0.11.2

  # Permissions & Device Info
  permission_handler: ^13.0.2

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.3

  # File Handling
  file_picker: ^8.0.0+1
  open_filex: ^4.4.0
  share_plus: ^12.0.2

  # Background Tasks
  flutter_local_notifications: ^22.3.3

  # UI Components
  flutter_slidable: ^5.2.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^5.1.1
  dropdown_search: ^8.1.0
  flutter_typeahead: ^6.0.0

  # Maps & Location
  google_maps_flutter: ^2.10.1

  # Barcode/QR Scanning
  mobile_scanner: ^7.5.0

  # Camera & ML
  camera: ^0.12.2
  tflite_flutter: ^0.12.1

  # Charts & Visualization
  fl_chart: ^1.3.0

  # PDF Generation
  pdf: ^3.11.0
  printing: ^5.12.0

  # Connectivity
  connectivity_plus: ^7.3.2

  # Encryption
  encrypt: ^5.0.3

  # Biometrics
  local_auth: ^3.0.2

  # Webview
  webview_flutter: ^4.8.0

  # Excel/CSV
  excel: ^4.0.4
  csv: ^8.0.0

  # Logging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.0.0
  freezed: ^4.0.3
  injectable_generator: ^3.1.3
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/labels/// Trigger new build
