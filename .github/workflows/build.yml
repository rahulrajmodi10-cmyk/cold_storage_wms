name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
        shell: bash
      - name: Analyze
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter analyze on lib/models/ lib/services/ ==="
          flutter analyze lib/models/ lib/services/ --fatal-infos 2>&1 | tee analyze_output.txt || true
      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-output
          path: analyze_output.txt

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
        shell: bash
      - name: Run tests
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter test test/ ==="
          flutter test test/ --verbose 2>&1 | tee test_output.txt || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output.txt

  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
        shell: bash
      - name: Create Android platform directory
        run: |
          echo "=== Checking if android directory exists ==="
          ls -la
          if [ ! -d "android" ]; then
            echo "Creating Android platform directory..."
            flutter create --platforms=android . 2>&1 || echo "flutter create failed, checking if it's a 'project already exists' error"
            ls -la android/ 2>/dev/null || echo "android directory not created"
          else
            echo "Android platform directory already exists"
            ls -la android/
          fi
      - name: Build APK (release)
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Working directory: $(pwd) ==="
          echo "=== Running flutter build apk --release --split-per-abi ==="
          flutter build apk --release --split-per-abi --verbose 2>&1 | tee build_apk_output.txt
          echo "=== Build APK exit code: ${PIPESTATUS[0]} ==="
          echo "=== Post-build working directory: $(pwd) ==="
          echo "=== Post-build build directory exists: $(test -d build && echo YES || echo NO) ==="
      - name: Build App Bundle (release)
        run: |
          echo "=== Working directory: $(pwd) ==="
          echo "=== Running flutter build appbundle --release ==="
          flutter build appbundle --release --verbose 2>&1 | tee build_aab_output.txt
          echo "=== Build AAB exit code: ${PIPESTATUS[0]} ==="
          echo "=== Post-build working directory: $(pwd) ==="
      - name: Verify APK/AAB outputs
        run: |
          echo "=== Working directory: $(pwd) ==="
          echo "=== Checking APK outputs ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir not found"
          echo "=== Checking AAB outputs ==="
          ls -la build/app/outputs/bundle/release/ 2>/dev/null || echo "bundle/release dir not found"
          echo "=== Full build/app tree ==="
          find build/app -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | head -20
          echo "=== Checking if any APKs exist ==="
          find build/app -name "*.apk" -type f 2>/dev/null | wc -l
          echo "=== Checking if any AABs exist ==="
          find build/app -name "*.aab" -type f 2>/dev/null | wc -l
          echo "=== Build APK output tail ==="
          tail -50 build_apk_output.txt
          echo "=== Build AAB output tail ==="
          tail -50 build_aab_output.txt
      - name: Debug - Check entire build directory structure
        run: |
          echo "=== Working directory: $(pwd) ==="
          echo "=== Full build directory tree ==="
          find build -type f 2>/dev/null | head -100
          echo "=== All directories in build ==="
          find build -type d 2>/dev/null | head -50
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-android-logs
          path: |
            build_apk_output.txt
            build_aab_output.txt
      - name: Find all APK and AAB files
        run: |
          echo "=== Working directory: $(pwd) ==="
          echo "=== Finding all APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Finding all AAB files ==="
          find . -name "*.aab" -type f 2>/dev/null
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            **/*.apk
            **/*.aab
          retention-days: 30
          if-no-files-found: warn

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
        shell: bash
      - name: Create Web platform directory
        run: |
          echo "=== Checking if web directory exists ==="
          ls -la
          if [ ! -d "web" ]; then
            echo "Creating Web platform directory..."
            flutter create --platforms=web . 2>&1 || echo "flutter create failed, checking if it's a 'project already exists' error"
            ls -la web/ 2>/dev/null || echo "web directory not created"
          else
            echo "Web platform directory already exists"
            ls -la web/
          fi
      - name: Build Web (release)
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Working directory: $(pwd) ==="
          echo "=== Running flutter build web --release ==="
          flutter build web --release --verbose 2>&1 | tee build_web_output.txt
          echo "=== Build Web exit code: ${PIPESTATUS[0]} ==="
          echo "=== Post-build working directory: $(pwd) ==="
          echo "=== Post-build build directory exists: $(test -d build && echo YES || echo NO) ==="
      - name: Verify Web outputs
        run: |
          echo "=== Working directory: $(pwd) ==="
          echo "=== Checking Web outputs ==="
          ls -la build/web/ 2>/dev/null || echo "build/web not found"
          echo "=== Full build/web tree ==="
          find build/web -type f 2>/dev/null | head -30
          echo "=== Build Web output tail ==="
          tail -50 build_web_output.txt
      - name: Debug - Check entire build directory structure (Web)
        run: |
          echo "=== Working directory: $(pwd) ==="
          echo "=== Full build directory tree (Web) ==="
          find build -type f 2>/dev/null | head -100
          echo "=== All directories in build (Web) ==="
          find build -type d 2>/dev/null | head -50
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-web-logs
          path: build_web_output.txt
      - name: List files to upload for Web artifacts
        run: |
          echo "=== Working directory: $(pwd) ==="
          echo "=== Files in build/web ==="
          ls -la build/web/ 2>/dev/null || echo "No web build found"
          echo "=== All files in build/web ==="
          find build/web -type f 2>/dev/null | head -30
          echo "=== All files anywhere in build/ ==="
          find build -type f 2>/dev/null | head -30
      - name: Upload Web artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: |
            build/web/
            **/build/web/**
          retention-days: 30
          if-no-files-found: warn

  build-desktop:
    name: Build Desktop (Linux/macOS/Windows)
    runs-on: ${{ matrix.os }}
    needs: [analyze]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi and Linux desktop (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Get dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Get dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "Attempt $i of 3..."
            flutter pub get --verbose
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Attempt $i failed, waiting 15 seconds..."
            Start-Sleep -Seconds 15
          }
        shell: powershell
      - name: Create Linux platform directory
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== Checking if linux directory exists ==="
          ls -la
          if [ ! -d "linux" ]; then
            echo "Creating Linux platform directory..."
            flutter create --platforms=linux . 2>&1 || echo "flutter create failed"
            ls -la linux/ 2>/dev/null || echo "linux directory not created"
          else
            echo "Linux platform directory already exists"
            ls -la linux/
          fi
      - name: Create macOS platform directory
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Checking if macos directory exists ==="
          ls -la
          if [ ! -d "macos" ]; then
            echo "Creating macOS platform directory..."
            flutter create --platforms=macos . 2>&1 || echo "flutter create failed"
            ls -la macos/ 2>/dev/null || echo "macos directory not created"
          else
            echo "macOS platform directory already exists"
            ls -la macos/
          fi
      - name: Create Windows platform directory
        if: matrix.os == 'windows-2022'
        run: |
          Write-Host "=== Checking if windows directory exists ==="
          Get-ChildItem
          if (-not (Test-Path "windows")) {
            Write-Host "Creating Windows platform directory..."
            flutter create --platforms=windows . 2>&1
            if (Test-Path "windows") {
              Get-ChildItem windows/
            } else {
              Write-Host "windows directory not created"
            }
          } else {
            Write-Host "Windows platform directory already exists"
            Get-ChildItem windows/
          }
        shell: powershell
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Working directory: $(pwd) ==="
          echo "=== Running flutter build linux --release ==="
          flutter build linux --release --verbose 2>&1 | tee build_linux_output.txt
          echo "=== Build Linux exit code: ${PIPESTATUS[0]} ==="
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        timeout-minutes: 30
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Working directory: $(pwd) ==="
          echo "=== Running flutter build macos --release ==="
          flutter build macos --release --verbose 2>&1 | tee build_macos_output.txt
          echo "=== Build macOS exit code: ${PIPESTATUS[0]} ==="
      - name: Build Windows
        if: matrix.os == 'windows-2022'
        timeout-minutes: 60
        run: |
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          $env:FLUTTER_VS_VERSION = "17"
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Working directory: $(pwd) ==="
          echo "=== Checking windows directory ==="
          Get-ChildItem windows/ -Directory
          echo "=== Running flutter build windows --release ==="
          # Capture both stdout and stderr to file and console
          $output = flutter build windows --release 2>&1
          $exitCode = $LASTEXITCODE
          $output | Out-File -FilePath build_windows_output.txt -Encoding utf8
          $output | Write-Host
          echo "=== Build Windows exit code: $exitCode ==="
          if ($exitCode -ne 0) {
            echo "=== BUILD FAILED - Showing last 300 lines ==="
            Get-Content build_windows_output.txt -Tail 300
          }
          exit $exitCode
        shell: powershell
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-logs-${{ matrix.os }}
          path: |
            build_linux_output.txt
            build_macos_output.txt
            build_windows_output.txt
      - name: List files to upload for Desktop artifacts
        run: |
          echo "=== Working directory: $(pwd) ==="
          echo "=== Files in build/linux ==="
          ls -la build/linux/ 2>/dev/null || echo "No Linux build found"
          echo "=== All files in build/linux ==="
          find build/linux -type f 2>/dev/null | head -30
          echo "=== Files in build/macos ==="
          ls -la build/macos/ 2>/dev/null || echo "No macOS build found"
          echo "=== All files in build/macos ==="
          find build/macos -type f 2>/dev/null | head -30
          echo "=== Files in build/windows ==="
          ls -la build/windows/ 2>/dev/null || echo "No Windows build found"
          echo "=== All files in build/windows ==="
          find build/windows -type f 2>/dev/null | head -30
          echo "=== All files anywhere in build/ ==="
          find build -type f 2>/dev/null | head -30
      - name: Upload Desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            build/linux/**/release/bundle/**
            build/macos/Build/Products/Release/**
            build/windows/**/runner/Release/**
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-web, build-desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Setup GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh
      - name: List available artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Available artifacts in this workflow run ==="
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | "\(.name) (\(.size_in_bytes) bytes)"'
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: artifacts/apks
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-web
          path: artifacts/web
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-ubuntu-latest
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-macos-latest
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-windows-latest
          path: artifacts/windows
      - name: List downloaded files
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | head -50
          echo "=== Directory structure ==="
          ls -la artifacts/
          echo "=== APK artifacts ==="
          ls -la artifacts/apks/ 2>/dev/null || echo "No apks dir"
          echo "=== Web artifacts ==="
          ls -la artifacts/web/ 2>/dev/null || echo "No web dir"
          echo "=== Linux artifacts ==="
          ls -la artifacts/linux/ 2>/dev/null || echo "No linux dir"
          echo "=== macOS artifacts ==="
          ls -la artifacts/macos/ 2>/dev/null || echo "No macos dir"
          echo "=== Windows artifacts ==="
          ls -la artifacts/windows/ 2>/dev/null || echo "No windows dir"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cold Storage WMS ${{ github.ref_name }}
          body: |
            ## Cold Storage Warehouse Management System

            ### Changes
            - Automated build from tag ${{ github.ref_name }}

            ### Downloads
            - **Android APKs** (arm64, arm32, x64): `app-release-*.apk`
            - **Android App Bundle**: `app-release.aab`
            - **Web**: Extract and host on any static hosting
            - **Desktop**: Platform-specific builds in respective folders

            ### Installation
            ```bash
            # Android
            adb install app-release-arm64-v8a.apk

            # Web
            # Host contents of web/ folder on any static hosting

            # Desktop
            # Run the executable in the respective platform folder
            ```
          files: |
            artifacts/apks/*.apk
            artifacts/apks/*.aab
            artifacts/web/**
            artifacts/linux/**
            artifacts/macos/**
            artifacts/windows/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
