name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            dart pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Analyze
        run: dart analyze lib/models/ lib/services/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            dart pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Run tests
        run: flutter test test/

  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi
      - name: Build App Bundle (release)
        run: flutter build appbundle --release
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Build Web (release)
        run: flutter build web --release
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: build/web/
          retention-days: 30

  build-desktop:
    name: Build Desktop (Linux/macOS/Windows)
    runs-on: ubuntu-latest
    needs: [analyze]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Get dependencies
        run: |
          flutter pub get --verbose || (echo "First attempt failed, retrying..." && sleep 10 && flutter pub get --verbose)
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --release
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: flutter build macos --release
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: flutter build windows --release
      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            build/linux/**/*
            build/macos/**/*
            build/windows/**/*
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-web, build-desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: artifacts/apks
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: artifacts/web
      - uses: actions/download-artifact@v4
        with:
          name: release-Linux
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: release-macOS
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: release-Windows
          path: artifacts/windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cold Storage WMS ${{ github.ref_name }}
          body: |
            ## Cold Storage Warehouse Management System

            ### Changes
            - Automated build from tag ${{ github.ref_name }}

            ### Downloads
            - **Android APKs** (arm64, arm32, x64): `app-release-*.apk`
            - **Android App Bundle**: `app-release.aab`
            - **Web**: Extract and host on any static hosting
            - **Desktop**: Platform-specific builds in respective folders

            ### Installation
            ```bash
            # Android
            adb install app-release-arm64-v8a.apk

            # Web
            # Host contents of web/ folder on any static hosting

            # Desktop
            # Run the executable in the respective platform folder
            ```
          files: |
            artifacts/apks/*.apk
            artifacts/apks/*.aab
            artifacts/web/**
            artifacts/linux/**
            artifacts/macos/**
            artifacts/windows/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}