name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Analyze
        run: |
          echo "=== Dart SDK version ==="
          dart --version
          echo "=== Running dart analyze on lib/models/ lib/services/ ==="
          dart analyze lib/models/ lib/services/ --fatal-infos 2>&1 | tee analyze_output.txt || true
      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-output
          path: analyze_output.txt

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Run tests
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter test test/ ==="
          flutter test test/ --verbose 2>&1 | tee test_output.txt || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output.txt

  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Build APK (release)
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter build apk --release --split-per-abi ==="
          flutter build apk --release --split-per-abi --verbose 2>&1 | tee build_apk_output.txt
          echo "=== Build APK exit code: ${PIPESTATUS[0]} ==="
      - name: Build App Bundle (release)
        run: |
          echo "=== Running flutter build appbundle --release ==="
          flutter build appbundle --release --verbose 2>&1 | tee build_aab_output.txt
          echo "=== Build AAB exit code: ${PIPESTATUS[0]} ==="
      - name: Verify APK/AAB outputs
        run: |
          echo "=== Checking APK outputs ==="
          ls -la build/app/outputs/flutter-apk/ || echo "flutter-apk dir not found"
          echo "=== Checking AAB outputs ==="
          ls -la build/app/outputs/bundle/release/ || echo "bundle/release dir not found"
          echo "=== Full build/app tree ==="
          find build/app -type f \( -name "*.apk" -o -name "*.aab" \) | head -20
          echo "=== Checking if any APKs exist ==="
          find build/app -name "*.apk" -type f | wc -l
          echo "=== Checking if any AABs exist ==="
          find build/app -name "*.aab" -type f | wc -l
          echo "=== Build APK output tail ==="
          tail -50 build_apk_output.txt
          echo "=== Build AAB output tail ==="
          tail -50 build_aab_output.txt
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-android-logs
          path: |
            build_apk_output.txt
            build_aab_output.txt
      - name: List files to upload for APK artifacts
        run: |
          echo "=== Files matching APK pattern ==="
          ls -la build/app/outputs/flutter-apk/*.apk 2>/dev/null || echo "No APKs found"
          echo "=== Files matching AAB pattern ==="
          ls -la build/app/outputs/bundle/release/*.aab 2>/dev/null || echo "No AABs found"
          echo "=== All files in build/app/outputs ==="
          find build/app/outputs -type f 2>/dev/null | head -30
          echo "=== All APKs anywhere in build/ ==="
          find build -name "*.apk" -type f 2>/dev/null | head -20
          echo "=== All AABs anywhere in build/ ==="
          find build -name "*.aab" -type f 2>/dev/null | head -20
      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: warn

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Build Web (release)
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter build web --release ==="
          flutter build web --release --verbose 2>&1 | tee build_web_output.txt
          echo "=== Build Web exit code: ${PIPESTATUS[0]} ==="
      - name: Verify Web outputs
        run: |
          echo "=== Checking Web outputs ==="
          ls -la build/web/ || echo "build/web not found"
          echo "=== Full build/web tree ==="
          find build/web -type f 2>/dev/null | head -30
          echo "=== Build Web output tail ==="
          tail -50 build_web_output.txt
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-web-logs
          path: build_web_output.txt
      - name: List files to upload for Web artifacts
        run: |
          echo "=== Files in build/web ==="
          ls -la build/web/ 2>/dev/null || echo "No web build found"
          echo "=== All files in build/web ==="
          find build/web -type f 2>/dev/null | head -30
          echo "=== All files anywhere in build/ ==="
          find build -type f 2>/dev/null | head -30
      - name: Upload Web artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: build/web/
          retention-days: 30
          if-no-files-found: warn

  build-desktop:
    name: Build Desktop (Linux/macOS/Windows)
    runs-on: ubuntu-latest
    needs: [analyze]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter build linux --release ==="
          flutter build linux --release --verbose 2>&1 | tee build_linux_output.txt
          echo "=== Build Linux exit code: ${PIPESTATUS[0]} ==="
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter build macos --release ==="
          flutter build macos --release --verbose 2>&1 | tee build_macos_output.txt
          echo "=== Build macOS exit code: ${PIPESTATUS[0]} ==="
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter build windows --release ==="
          flutter build windows --release --verbose 2>&1 | tee build_windows_output.txt
          echo "=== Build Windows exit code: ${PIPESTATUS[0]} ==="
      - name: Verify Desktop outputs
        run: |
          echo "=== Checking Linux outputs ==="
          ls -la build/linux/ 2>/dev/null || echo "build/linux not found"
          find build/linux -type f 2>/dev/null | head -30
          echo "=== Checking macOS outputs ==="
          ls -la build/macos/ 2>/dev/null || echo "build/macos not found"
          find build/macos -type f 2>/dev/null | head -30
          echo "=== Checking Windows outputs ==="
          ls -la build/windows/ 2>/dev/null || echo "build/windows not found"
          find build/windows -type f 2>/dev/null | head -30
          echo "=== Build Linux output tail ==="
          tail -50 build_linux_output.txt 2>/dev/null || echo "No linux output"
          echo "=== Build macOS output tail ==="
          tail -50 build_macos_output.txt 2>/dev/null || echo "No macos output"
          echo "=== Build Windows output tail ==="
          tail -50 build_windows_output.txt 2>/dev/null || echo "No windows output"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop-logs-${{ runner.os }}
          path: |
            build_linux_output.txt
            build_macos_output.txt
            build_windows_output.txt
      - name: List files to upload for Desktop artifacts
        run: |
          echo "=== Files in build/linux ==="
          ls -la build/linux/ 2>/dev/null || echo "No Linux build found"
          echo "=== All files in build/linux ==="
          find build/linux -type f 2>/dev/null | head -30
          echo "=== Files in build/macos ==="
          ls -la build/macos/ 2>/dev/null || echo "No macOS build found"
          echo "=== All files in build/macos ==="
          find build/macos -type f 2>/dev/null | head -30
          echo "=== Files in build/windows ==="
          ls -la build/windows/ 2>/dev/null || echo "No Windows build found"
          echo "=== All files in build/windows ==="
          find build/windows -type f 2>/dev/null | head -30
          echo "=== All files anywhere in build/ ==="
          find build -type f 2>/dev/null | head -30
      - name: Upload Desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            build/linux/**/*
            build/macos/**/*
            build/windows/**/*
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-web, build-desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Setup GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh
      - name: List available artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Available artifacts in this workflow run ==="
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | "\(.name) (\(.size_in_bytes) bytes)"'
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: artifacts/apks
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-web
          path: artifacts/web
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-Linux
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-macOS
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-Windows
          path: artifacts/windows
      - name: List downloaded files
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | head -50
          echo "=== Directory structure ==="
          ls -la artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cold Storage WMS ${{ github.ref_name }}
          body: |
            ## Cold Storage Warehouse Management System

            ### Changes
            - Automated build from tag ${{ github.ref_name }}

            ### Downloads
            - **Android APKs** (arm64, arm32, x64): `app-release-*.apk`
            - **Android App Bundle**: `app-release.aab`
            - **Web**: Extract and host on any static hosting
            - **Desktop**: Platform-specific builds in respective folders

            ### Installation
            ```bash
            # Android
            adb install app-release-arm64-v8a.apk

            # Web
            # Host contents of web/ folder on any static hosting

            # Desktop
            # Run the executable in the respective platform folder
            ```
          files: |
            artifacts/apks/*.apk
            artifacts/apks/*.aab
            artifacts/web/**
            artifacts/linux/**
            artifacts/macos/**
            artifacts/windows/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}