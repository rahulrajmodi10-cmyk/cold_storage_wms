name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
        shell: bash
      - name: Analyze
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter analyze on lib/models/ lib/services/ ==="
          flutter analyze lib/models/ lib/services/ --fatal-infos 2>&1 | tee analyze_output.txt || true
      - name: Upload analyze output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-output
          path: analyze_output.txt

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock
      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
        shell: bash
      - name: Run tests
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter test test/ ==="
          flutter test test/ --verbose 2>&1 | tee test_output.txt || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output.txt

  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Generate local.properties
        run: |
          echo "flutterRoot=$(dirname "$(dirname "$(command -v flutter)")")" > android/local.properties
          echo "sdk.dir=${ANDROID_HOME:-/usr/lib/android-sdk}" >> android/local.properties
          echo "=== local.properties contents ==="
          cat android/local.properties
      - name: Get dependencies
        run: flutter pub get --verbose
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
      - name: Generate debug keystore
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v -keystore android/keystore/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -dname "CN=Android Debug,O=Android,C=US" -validity 10000
      - name: Build APK (release)
        run: |
          echo "=== Flutter version ==="
          flutter --version
          flutter build apk --release --split-per-abi --verbose
      - name: Build App Bundle (release)
        run: |
          echo "=== Building AAB ==="
          flutter build appbundle --release --verbose
      - name: Verify APK artifacts exist
        run: |
          echo "=== Checking APK files ==="
          ls -la build/app/outputs/flutter-apk/release/
          APK_COUNT=$(ls build/app/outputs/flutter-apk/release/*.apk 2>/dev/null | wc -l)
          echo "APK files count: $APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK files found"
            exit 1
          fi
      - name: Verify AAB artifact exists
        run: |
          echo "=== Checking AAB file ==="
          ls -la build/app/outputs/bundle/release/
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "ERROR: No AAB file found"
            exit 1
          fi
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-android-logs
          path: |
            build/**/*.txt
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            build/app/outputs/flutter-apk/release/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Get dependencies
        run: flutter pub get --verbose
      - name: Build Web (release)
        run: |
          echo "=== Flutter version ==="
          flutter --version
          flutter build web --release --verbose
      - name: Verify Web outputs
        run: |
          echo "=== Checking Web outputs ==="
          ls -la build/web/
          if [ ! -d "build/web" ] || [ -z "$(ls -A build/web 2>/dev/null)" ]; then
            echo "ERROR: No Web build files found in build/web/"
            exit 1
          fi
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: build/web/
          retention-days: 30
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (Linux/macOS/Windows)
    runs-on: ${{ matrix.os }}
    needs: [analyze]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies for sqflite_common_ffi and Linux desktop (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: 'stable'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-
      - name: Get dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
      - name: Get dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "Attempt $i of 3..."
            flutter pub get --verbose
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Attempt $i failed, waiting 15 seconds..."
            Start-Sleep -Seconds 15
          }
        shell: powershell
      - name: Create Linux platform directory
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== Checking if linux directory exists ==="
          ls -la
          if [ ! -d "linux" ]; then
            echo "Creating Linux platform directory..."
            flutter create --platforms=linux .
            ls -la linux/
          else
            echo "Linux platform directory already exists"
            ls -la linux/
          fi
      - name: Create macOS platform directory
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Checking if macos directory exists ==="
          ls -la
          if [ ! -d "macos" ]; then
            echo "Creating macOS platform directory..."
            flutter create --platforms=macos .
            ls -la macos/
          else
            echo "macOS platform directory already exists"
            ls -la macos/
          fi
      - name: Create Windows platform directory
        if: matrix.os == 'windows-2022'
        run: |
          Write-Host "=== Checking if windows directory exists ==="
          Get-ChildItem
          if (-not (Test-Path "windows")) {
            Write-Host "Creating Windows platform directory..."
            flutter create --platforms=windows .
            if (Test-Path "windows") {
              Get-ChildItem windows/
            }
          } else {
            Write-Host "Windows platform directory already exists"
            Get-ChildItem windows/
          }
        shell: powershell
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter build linux --release ==="
          flutter build linux --release --verbose
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        timeout-minutes: 30
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter build macos --release ==="
          flutter build macos --release --verbose
      - name: Build Windows
        if: matrix.os == 'windows-2022'
        timeout-minutes: 60
        run: |
          $env:CMAKE_GENERATOR = "Visual Studio 17 2022"
          $env:FLUTTER_VS_VERSION = "17"
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter build windows --release ==="
          $output = flutter build windows --release 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          echo "=== Build exit code: $exitCode ==="
          if ($exitCode -ne 0) {
            echo "=== BUILD FAILED ==="
          }
          exit $exitCode
        shell: powershell
      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}
          path: |
            build/linux/**/release/bundle/**
            build/macos/Build/Products/Release/**
            build/windows/**/runner/Release/**
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Setup GitHub CLI
        run: sudo apt-get install -y gh
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: artifacts/apks
          merge-multiple: true
      - name: Verify APK artifacts downloaded
        run: |
          echo "=== Verifying downloaded APK artifacts ==="
          ls -la artifacts/apks/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cold Storage WMS ${{ github.ref_name }}
          body: |
            ## Cold Storage Warehouse Management System

            ### Downloads
            - **Android APKs** (arm64, arm32, x64): `app-release-*.apk`
            - **Android App Bundle**: `app-release.aab`

            ### Installation
            ```bash
            # Android
            adb install artifacts/apks/app-release-arm64-v8a.apk
            ```
          files: |
            artifacts/apks/*.apk
            artifacts/apks/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}