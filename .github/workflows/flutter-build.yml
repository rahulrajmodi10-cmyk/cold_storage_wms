name: Flutter Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: flutter-deps-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            flutter-deps-

      - name: Verify pubspec.lock exists
        run: ls -la pubspec.lock

      - name: Get dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            flutter pub get --verbose && break
            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done
        shell: bash

      - name: Analyze code
        run: flutter analyze

      - name: Build APK (Debug)
        run: flutter build apk --debug --verbose 2>&1 | tee build_apk_debug_output.txt

      - name: Build APK (Release)
        run: flutter build apk --release --verbose 2>&1 | tee build_apk_release_output.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/release/app-release.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_apk_debug_output.txt
            build_apk_release_output.txt