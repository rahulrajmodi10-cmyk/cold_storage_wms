org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=false
android.ndkVersion=28.2.13676358
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# New DSL is the default in AGP 9+, so this is no longer needed
# android.newDsl=false
# Disable AAPT2 daemon to avoid startup issues in proot-distro
android.aapt2.daemon=false
android.enableAapt2=true
# NOTE: Do not set org.gradle.java.home here. The path is machine-specific and
# breaks CI (GitHub Actions) where the runner JDK lives elsewhere.
# CI uses the JDK preinstalled on the runner; local Android/Termux builds can
# set it in ~/.gradle/gradle.properties instead.
# NOTE: Do not set android.aapt2FromMavenOverride here either — the override
# points at a local ARM64 aapt2 binary that only exists on this device.
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
